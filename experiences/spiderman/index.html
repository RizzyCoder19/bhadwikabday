<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Spider-Man — Progressive Sketch (Turtle Graphics)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Outfit:wght@300;400&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      user-select: none;
    }

    /* Ambient Cinema Stage Background */
    .cinema-backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #0d0c10 0%, #020203 100%);
      z-index: 1;
    }

    /* Fine Art Sketchpad Card */
    .sketchpad-container {
      position: relative;
      z-index: 2;
      width: 90vw;
      max-width: 840px;
      height: 84vh;
      max-height: 600px;
      aspect-ratio: 800 / 575;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 
        0 0 50px rgba(255, 255, 255, 0.05),
        0 20px 45px rgba(0, 0, 0, 0.8),
        inset 0 0 0 1px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }

    .sketchpad-container:hover {
      box-shadow: 
        0 0 60px rgba(255, 255, 255, 0.08),
        0 24px 50px rgba(0, 0, 0, 0.9),
        inset 0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    /* Main High-DPI Sketch Canvas */
    canvas#sketchCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Animated Turtle Pen Cursor */
    .turtle-pen {
      position: absolute;
      width: 22px;
      height: 22px;
      pointer-events: none;
      transform: translate(-50%, -50%) rotate(0deg);
      transition: opacity 0.5s ease;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
    }

    /* Sketchpad Ambient HUD */
    .sketchpad-header {
      position: absolute;
      top: 14px;
      left: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      opacity: 0.7;
      transition: opacity 0.4s ease;
    }

    .sketchpad-tag {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.5);
    }

    .sketchpad-status {
      position: absolute;
      bottom: 14px;
      right: 18px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .sketchpad-hint {
      position: absolute;
      bottom: 14px;
      left: 18px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 300;
      color: rgba(0, 0, 0, 0.35);
      letter-spacing: 0.05em;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
  </style>
</head>

      const ORIG_W = 393;
      const ORIG_H = 700;

      let W = 800;
      let H = 575;
      let scale = 1;
      let offsetX = 0;
      let offsetY = 0;

      // Offscreen canvas for completed ink shapes
      const inkCanvas = document.createElement('canvas');
      const inkCtx = inkCanvas.getContext('2d');

      function resize() {
        const rect = sketchpad.getBoundingClientRect();
        const rw = Math.max(rect.width || 0, 320);
        const rh = Math.max(rect.height || 0, 230);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        W = Math.round(rw);
        H = Math.round(rh);

        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.scale(dpr, dpr);

        inkCanvas.width = W * dpr;
        inkCanvas.height = H * dpr;
        inkCtx.scale(dpr, dpr);
        inkCtx.fillStyle = '#ffffff';
        inkCtx.fillRect(0, 0, W, H);

        // Keep 0.82 scale matching Spiderman.py scale = 0.8
        scale = Math.min((W * 0.82) / ORIG_W, (H * 0.90) / ORIG_H);
        offsetX = (W - ORIG_W * scale) / 2;
        offsetY = (H - ORIG_H * scale) / 2;
      }

      window.addEventListener('resize', () => {
        // Redraw current completed state on resize
        resize();
        renderFrame();
      });

      resize();

      function mapPoint(px, py) {
        return [offsetX + px * scale, offsetY + py * scale];
      }

      // Animation state
      let contourIdx = 0;
      let pointIdx = 0;
      let currentPath = [];
      let isComplete = false;
      let hasNotified = false;
      let turtleX = 0;
      let turtleY = 0;
      let turtleAngle = 0;

      // Drawing speed: ~7 points per frame for a graceful, mesmerizing ~7s sketch
      const PTS_PER_FRAME = 7;

      function renderFrame() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);
        // Draw completed ink background
        ctx.drawImage(inkCanvas, 0, 0, W, H);

        // Draw in-progress live pen stroke
        if (!isComplete && currentPath.length > 1) {
          ctx.strokeStyle = '#050505';
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(currentPath[0][0], currentPath[0][1]);
          for (let i = 1; i < currentPath.length; i++) {
            ctx.lineTo(currentPath[i][0], currentPath[i][1]);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function commitAllContours() {
        // Fast-forward or complete all shapes
        inkCtx.fillStyle = '#0a0a0a';
        inkCtx.strokeStyle = '#0a0a0a';
        inkCtx.lineWidth = 1.4;

        inkCtx.beginPath();
        for (let c = 0; c < CONTOURS.length; c++) {
          const pts = CONTOURS[c];
          if (pts.length < 2) continue;
          const [x0, y0] = mapPoint(pts[0][0], pts[0][1]);
          inkCtx.moveTo(x0, y0);
          for (let i = 1; i < pts.length; i++) {
            const [x, y] = mapPoint(pts[i][0], pts[i][1]);
            inkCtx.lineTo(x, y);
          }
          inkCtx.closePath();
        }
        // EvenOdd fill rule correctly carves out Spider-Man's eyes and negative spaces
        inkCtx.fill('evenodd');
        inkCtx.stroke();
      }

      function finishScene() {
        if (isComplete) return;
        isComplete = true;

        commitAllContours();
        renderFrame();

        // Hide turtle pen and hint
        turtle.style.opacity = '0';
        if (hintEl) hintEl.style.opacity = '0';
        if (statusEl) statusEl.textContent = 'Artwork Completed';

        if (!hasNotified) {
          hasNotified = true;
          // Hold the finished silhouette proudly for 3.5s before sending completion message
          setTimeout(() => {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'CASA_SCENE_FINISHED', scene: 'spiderman' }, '*');
            }
          }, 3500);
        }
      }

      // Allow click anywhere to instant-finish
      sketchpad.addEventListener('click', () => {
        if (!isComplete) {
          finishScene();
        }
      });

      function tick() {
        if (isComplete) return;

        let steps = 0;
        while (steps < PTS_PER_FRAME && contourIdx < CONTOURS.length) {
          const c = CONTOURS[contourIdx];

          if (pointIdx === 0) {
            currentPath = [];
            const [x0, y0] = mapPoint(c[0][0], c[0][1]);
            currentPath.push([x0, y0]);
            turtleX = x0;
            turtleY = y0;
            pointIdx = 1;
          }

          while (pointIdx < c.length && steps < PTS_PER_FRAME) {
            const [x, y] = mapPoint(c[pointIdx][0], c[pointIdx][1]);
            const dx = x - turtleX;
            const dy = y - turtleY;
            if (dx !== 0 || dy !== 0) {
              turtleAngle = Math.atan2(dy, dx) * (180 / Math.PI) - 90;
            }
            turtleX = x;
            turtleY = y;
            currentPath.push([x, y]);
            pointIdx++;
            steps++;
          }

          if (pointIdx >= c.length) {
            // Contour finished - commit stroke to ink canvas
            if (currentPath.length > 2) {
              inkCtx.strokeStyle = '#050505';
              inkCtx.lineWidth = 1.6;
              inkCtx.lineCap = 'round';
              inkCtx.lineJoin = 'round';
              inkCtx.beginPath();
              inkCtx.moveTo(currentPath[0][0], currentPath[0][1]);
              for (let i = 1; i < currentPath.length; i++) {
                inkCtx.lineTo(currentPath[i][0], currentPath[i][1]);
              }
              inkCtx.closePath();
              inkCtx.stroke();
            }
            contourIdx++;
            pointIdx = 0;
            currentPath = [];
          }
        }

        // Update turtle pen position
        turtle.style.left = turtleX + 'px';
        turtle.style.top = turtleY + 'px';
        turtle.style.transform = 'translate(-50%, -50%) rotate(' + turtleAngle + 'deg)';

        renderFrame();

        if (contourIdx >= CONTOURS.length) {
          finishScene();
          return;
        }

        requestAnimationFrame(tick);
      }

      // Initial kickoff after frame layout
      requestAnimationFrame(() => {
        resize();
        requestAnimationFrame(tick);
      });

    })();
