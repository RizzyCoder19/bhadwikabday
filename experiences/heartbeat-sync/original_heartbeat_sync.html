<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>≡ƒÆô Heartbeat Sync ΓÇö Two Hearts, One Beat</title>
  <meta name="description" content="A romantic particle animation ΓÇö two hearts beat, approach each other, and merge into one." />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Great+Vibes&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #020002;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      user-select: none;
    }

    canvas#main {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
    }

    /* ΓöÇΓöÇ Tap-to-start Overlay ΓöÇΓöÇ */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 50%, #0d0008 0%, #020002 100%);
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.8s ease;
    }
    #overlay.fade-out { opacity: 0; pointer-events: none; }

    .overlay-heart {
      font-size: 72px;
      animation: pulseHeart 1.3s ease-in-out infinite;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 24px rgba(255,107,138,0.8));
    }
    .overlay-title {
      font-family: 'Great Vibes', cursive;
      font-size: 38px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255,107,138,0.6);
      margin-bottom: 10px;
    }
    .overlay-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    @keyframes pulseHeart {
      0%   { transform: scale(1);    filter: drop-shadow(0 0 15px rgba(255,107,138,0.6)); }
      50%  { transform: scale(1.18); filter: drop-shadow(0 0 35px rgba(255,107,138,1)); }
      100% { transform: scale(1);    filter: drop-shadow(0 0 15px rgba(255,107,138,0.6)); }
    }

    /* ΓöÇΓöÇ Settings Panel ΓöÇΓöÇ */
    #settingsBtn {
      position: fixed; top: 16px; right: 16px;
      z-index: 50;
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255,107,138,0.15);
      border: 1.5px solid rgba(255,107,138,0.4);
      backdrop-filter: blur(12px);
      color: #ff6b8a;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(255,107,138,0.3);
    }
    #settingsBtn:hover { transform: scale(1.1); background: rgba(255,107,138,0.25); }

    #settingsPanel {
      position: fixed; top: 0; right: 0;
      height: 100%; width: 300px;
      background: rgba(4,0,6,0.97);
      backdrop-filter: blur(24px);
      border-left: 1px solid rgba(255,107,138,0.2);
      z-index: 40;
      transform: translateX(100%);
      transition: transform 0.45s cubic-bezier(0.4,0,0.2,1);
      overflow-y: auto;
      padding: 24px 20px 80px;
    }
    #settingsPanel.open { transform: translateX(0); }

    .panel-title {
      font-family: 'Great Vibes', cursive;
      font-size: 26px;
      color: #ff6b8a;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-close {
      margin-left: auto; cursor: pointer;
      font-size: 18px; color: rgba(255,107,138,0.6);
      background: none; border: none;
      transition: color 0.2s;
    }
    .panel-close:hover { color: #ff6b8a; }

    .field-label {
      display: block;
      font-size: 11px;
      color: rgba(255,107,138,0.7);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .field-input {
      width: 100%;
      background: rgba(255,107,138,0.08);
      border: 1px solid rgba(255,107,138,0.25);
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 14px;
      font-family: 'Outfit', sans-serif;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .field-input:focus { border-color: rgba(255,107,138,0.6); }

    .color-row {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .color-opt {
      flex: 1; padding: 8px 4px;
      border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.5);
      font-size: 11px; text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .color-opt.active {
      border-color: #ff6b8a;
      background: rgba(255,107,138,0.2);
      color: #ff6b8a;
    }

    .divider {
      height: 1px;
      background: rgba(255,107,138,0.12);
      margin: 18px 0;
    }

    /* ΓöÇΓöÇ Control Bar ΓöÇΓöÇ */
    #controlBar {
      position: fixed; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex; gap: 12px; align-items: center;
    }
    .ctrl-btn {
      padding: 10px 20px;
      border-radius: 50px;
      border: 1.5px solid rgba(255,107,138,0.4);
      background: rgba(4,0,6,0.85);
      backdrop-filter: blur(12px);
      color: #ff6b8a;
      font-size: 13px; font-weight: 600;
      font-family: 'Outfit', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: all 0.25s;
      box-shadow: 0 0 16px rgba(255,107,138,0.2);
    }
    .ctrl-btn:hover { background: rgba(255,107,138,0.15); transform: translateY(-2px); }
    .ctrl-btn:active { transform: translateY(0); }
    .ctrl-btn.rec {
      border-color: rgba(255,60,80,0.6);
      color: #ff3c50;
      box-shadow: 0 0 16px rgba(255,60,80,0.3);
    }
    .ctrl-btn.rec.active {
      background: rgba(255,60,80,0.2);
      animation: recPulse 1s infinite;
    }
    @keyframes recPulse {
      0%,100% { box-shadow: 0 0 16px rgba(255,60,80,0.3); }
      50% { box-shadow: 0 0 30px rgba(255,60,80,0.7); }
    }
  </style>
</head>
<body>

<canvas id="main"></canvas>

</div>

<!-- Settings button -->
<button id="settingsBtn" title="Customize">ΓÜÖ</button>

<!-- Settings panel -->
<div id="settingsPanel">
  <div class="panel-title">
    ≡ƒÆô Customize
    <button class="panel-close" id="panelClose">Γ£ò</button>

  <label class="field-label">Name 1 (Left Heart)</label>

</div>

<!-- Control bar -->

  <button class="ctrl-btn" id="btn-restart">Γå║ Restart</button>
  <button class="ctrl-btn rec" id="btn-rec">ΓÅ║ Record</button>
</div>

<script>
// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
//  HEARTBEAT SYNC  ┬╖  Romantic Particle Animation
//  Standalone HTML5 Canvas + Web Audio API
// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ

const canvas = document.getElementById('main');
const ctx    = canvas.getContext('2d');

// ΓöÇΓöÇ Config (live-updated by panel) ΓöÇΓöÇ
const CFG = {
  name1:   'Romeo',
  name2:   'Juliet',
  msg:     'Two Hearts, One Beat',
  sub:     'Forever Yours ≡ƒÆ¢',
  color1:  { main:'#ffffff', glow:'rgba(255,255,255,0.85)', dark:'#e0e0e0' },
  color2:  { main:'#ffffff', glow:'rgba(255,255,255,0.85)', dark:'#e0e0e0' },
  merged:  { main:'#ffd700', glow:'rgba(255,215,0,0.8)',   dark:'#c8a000' },
  speed:   1.0,
  sound:   true,
};

const COLOR_SCHEMES = {
  white:  { main:'#ffffff', glow:'rgba(255,255,255,0.85)', dark:'#e0e0e0' },
  pink:   { main:'#ff6b8a', glow:'rgba(255,107,138,0.7)', dark:'#c4295a' },
  red:    { main:'#ff2d55', glow:'rgba(255,45,85,0.7)',   dark:'#b30030' },
  coral:  { main:'#ff7f6e', glow:'rgba(255,127,110,0.7)', dark:'#c4452a' },
  purple: { main:'#8b7bf7', glow:'rgba(139,123,247,0.7)', dark:'#5a47c4' },
  blue:   { main:'#4fa8ff', glow:'rgba(79,168,255,0.7)',  dark:'#1a70cc' },
  teal:   { main:'#2dd4bf', glow:'rgba(45,212,191,0.7)',  dark:'#0a9a87' },
};

// ΓöÇΓöÇ Resize ΓöÇΓöÇ
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = window.innerWidth  * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.scale(dpr, dpr);
  W = window.innerWidth;
  H = window.innerHeight;
}
let W = window.innerWidth, H = window.innerHeight;
window.addEventListener('resize', () => { resize(); resetScene(); });
resize();

// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
//  WEB AUDIO SYNTHESIZER
// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
let audioCtx = null;
let pannerL = null, pannerR = null, pannerC = null;
let bgmIntervalId = null, bgmStep = 0, bgmPlaying = false;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  pannerL = audioCtx.createStereoPanner(); pannerL.pan.value = -0.75;
  pannerR = audioCtx.createStereoPanner(); pannerR.pan.value =  0.75;
  pannerC = audioCtx.createStereoPanner(); pannerC.pan.value =  0.0;
  pannerL.connect(audioCtx.destination);
  pannerR.connect(audioCtx.destination);
  pannerC.connect(audioCtx.destination);
}

function playHeartbeat(side = 'L', power = 1.0) {
  if (!CFG.sound || !audioCtx) return;
  const dest = side === 'L' ? pannerL : side === 'R' ? pannerR : pannerC;
  const now = audioCtx.currentTime;
  [0, 0.19].forEach((delay) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(side === 'C' ? 52 : 65, now + delay);
    osc.frequency.exponentialRampToValueAtTime(side === 'C' ? 14 : 20, now + delay + (side==='C'?0.22:0.16));
    gain.gain.setValueAtTime(0.0, now + delay);
    gain.gain.linearRampToValueAtTime(0.32 * power, now + delay + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.01, now + delay + (side==='C'?0.22:0.16));
    osc.connect(gain); gain.connect(dest);
    osc.start(now + delay);
    osc.stop(now + delay + 0.25);
  });
}

function playSparkle() {
  if (!CFG.sound || !audioCtx) return;
  const now = audioCtx.currentTime;
  const freq = 900 + Math.random() * 700;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.exponentialRampToValueAtTime(freq / 2, now + 0.28);
  gain.gain.setValueAtTime(0.05, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
  osc.connect(gain); gain.connect(pannerC);
  osc.start(now); osc.stop(now + 0.28);
}

function playChordSwell(notes, duration = 2.0) {
  if (!CFG.sound || !audioCtx) return;
  const now = audioCtx.currentTime;
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), filter = audioCtx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now + i * 0.08);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(1800, now + i*0.08);
    filter.frequency.exponentialRampToValueAtTime(300, now + i*0.08 + duration);
    gain.gain.setValueAtTime(0, now + i*0.08);
    gain.gain.linearRampToValueAtTime(0.055, now + i*0.08 + 0.12);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.08 + duration);
    osc.connect(filter); filter.connect(gain); gain.connect(pannerC);
    osc.start(now + i*0.08); osc.stop(now + i*0.08 + duration + 0.1);
  });
}

function playMergeExplosion() {
  if (!CFG.sound || !audioCtx) return;
  // Big chord swell
  playChordSwell([130.81, 164.81, 196, 261.63, 329.63, 392, 523.25], 3.0);
  // Rumble
  const now = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.6, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 2);
  const src = audioCtx.createBufferSource(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 120;
  g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now+0.6);
  src.buffer = buf; src.connect(f); f.connect(g); g.connect(pannerC);
  src.start(now); src.stop(now+0.6);
}

function playHeartReveal() {
  if (!CFG.sound || !audioCtx) return;
  playChordSwell([220, 261.63, 329.63, 392, 523.25, 659.25], 2.8);
}

const BGM_NOTES = [
  174.61, 220.00, 261.63, 329.63, 440.00, 523.25,
  196.00, 246.94, 293.66, 329.63, 392.00, 493.88,
  220.00, 261.63, 329.63, 392.00, 440.00, 523.25,
  164.81, 196.00, 246.94, 293.66, 329.63, 392.00,
];
function playMusicBoxNote(freq, dur=2.2) {
  if (!CFG.sound || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain(), filt=audioCtx.createBiquadFilter();
  osc.type='triangle'; osc.frequency.setValueAtTime(freq,now);
  filt.type='lowpass'; filt.frequency.setValueAtTime(900,now); filt.frequency.exponentialRampToValueAtTime(140,now+dur);
  gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(0.055,now+0.05); gain.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  osc.connect(filt); filt.connect(gain); gain.connect(pannerC);
  osc.start(now); osc.stop(now+dur);
}
function startBGM() {
  if (bgmPlaying) return;
  bgmPlaying = true; bgmStep = 0;
  bgmIntervalId = setInterval(() => {
    if (!bgmPlaying) return;
    const ci = Math.floor(bgmStep/8)%4;
    const co = ci*6;
    const si = bgmStep%8;
    const ni = [0,2,4,3,5,4,2,1][si];
    const freq = BGM_NOTES[co+ni] * (Math.random()<0.2&&si>2?2:1);
    playMusicBoxNote(freq, 2.2);
    bgmStep++;
  }, 820);
}
function stopBGM() {
  bgmPlaying = false;
  if (bgmIntervalId) { clearInterval(bgmIntervalId); bgmIntervalId=null; }
}

//  PARTICLE SYSTEM

// Draw a tiny vector heart
function drawHeart(ctx, x, y, size, color, alpha, glowColor, glowBlur) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
  ctx.translate(x, y);
  ctx.fillStyle = color;
  if (glowColor) { ctx.shadowColor = glowColor; ctx.shadowBlur = glowBlur || size*1.4; }
  const s = size;
  ctx.beginPath();
  ctx.moveTo(0,  s*0.3);
  ctx.bezierCurveTo(0,-s*0.45, -s*0.95,-s*0.45, -s*0.95, s*0.2);
  ctx.bezierCurveTo(-s*0.95, s*0.7, -s*0.45, s*1.05, 0, s*1.4);
  ctx.bezierCurveTo( s*0.45, s*1.05,  s*0.95, s*0.7,  s*0.95, s*0.2);
  ctx.bezierCurveTo( s*0.95,-s*0.45, 0,-s*0.45, 0, s*0.3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Sample parametric heart points (both contour & filled interior)
function sampleHeartPoints(cx, cy, scale, count) {
  const pts = [];
  const outlineCount = Math.floor(count * 0.50);
  const fillCount = count - outlineCount;

  // 1. Outline contour points
  for (let i = 0; i < outlineCount; i++) {
    const t = (i / outlineCount) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    pts.push({ x: cx + x*scale, y: cy + y*scale });
  }

  // 2. Uniformly distributed interior points (scaled towards centroid y = +2.5)
  for (let i = 0; i < fillCount; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = 0.15 + 0.85 * Math.sqrt(Math.random());
    const bx = 16 * Math.pow(Math.sin(t), 3);
    const by = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    const cyCenter = 2.5; // Centroid of parametric heart
    const x = bx * r;
    const y = cyCenter + (by - cyCenter) * r;
    pts.push({ x: cx + x*scale, y: cy + y*scale });
  }
  return pts;
}

// Sample text pixels into points
function sampleText(text, W, H, fontSize) {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const ox = oc.getContext('2d');
  ox.fillStyle = '#fff';
  ox.font = `600 ${fontSize}px 'Outfit', sans-serif`;
  ox.textAlign = 'center';
  ox.textBaseline = 'middle';
  ox.fillText(text, W/2, H/2);
  const d = ox.getImageData(0,0,W,H).data;
  const pts = [];
  const step = Math.max(3, Math.floor((W*H)/80000));
  for (let y=0; y<H; y+=step)
    for (let x=0; x<W; x+=step)
      if (d[(y*W+x)*4+3] > 100) pts.push({x, y});
  // shuffle
  for (let i=pts.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [pts[i],pts[j]]=[pts[j],pts[i]];
  }
  return pts;
}

// Particle pool
const PARTICLE_COUNT = 2000; // 1000 per heart ΓÇö DENSE!
let particles = [];
let stars = [];
let fallingHearts = [];
let flyTrailParticles = [];

function createParticle(x, y, color, side) {
  return {
    x, y,
    tx: x, ty: y,
    vx: (Math.random()-0.5)*2,
    vy: (Math.random()-0.5)*2,
    size: 3.0 + Math.random()*3.5,
    color,
    alpha: 0.0,
    targetAlpha: 0.92,
    side, // 'L' | 'R' | 'C'
    swayPhase: Math.random()*Math.PI*2,
  };
}

function initParticles() {
  particles = [];
  stars = [];
  fallingHearts = [];
  flyTrailParticles = [];

  // Stars
  for (let i=0; i<120; i++) {
    stars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: 0.5+Math.random()*1.6,
      alpha: Math.random(),
      phase: Math.random()*Math.PI*2,
      speed: 0.5+Math.random()*1.5,
    });
  }

  const halfL = Math.floor(PARTICLE_COUNT/2);
  const halfR = PARTICLE_COUNT - halfL;

  // Left heart particles
  const lPts = sampleHeartPoints(W*0.28, H*0.42, getHeartScale(), halfL);
  for (const pt of lPts) particles.push(createParticle(pt.x, pt.y, CFG.color1.main, 'L'));

  // Right heart particles
  const rPts = sampleHeartPoints(W*0.72, H*0.42, getHeartScale(), halfR);
  for (const pt of rPts) particles.push(createParticle(pt.x, pt.y, CFG.color2.main, 'R'));
}

function getHeartScale() {
  return Math.min(W, H) * 0.012;
}

function enterPhase(ph) {
  state.phase = ph;
  state.elapsed = 0;

  if (ph === PHASE.FLY_IN) {
    // Hearts start fully offscreen left & right
    state.lx = -W*0.2; state.ly = H*0.45;
    state.rx =  W*1.2; state.ry = H*0.45;
    state.cx =  W*0.50; state.cy = H*0.45;
    state.beatInterval = 0.85 / CFG.speed;
    state.lBeat = 0; state.rBeat = 0;
    state.nameTextAlpha = 0;
    // Place all particles at their offscreen heart positions
    const half = Math.floor(particles.length/2);
    const lPts = sampleHeartPoints(state.lx, state.ly, getHeartScale(), half);
    const rPts = sampleHeartPoints(state.rx, state.ry, getHeartScale(), particles.length - half);
    for (let i=0; i<half; i++) {
      const p = particles[i];
      p.x = lPts[i%lPts.length].x; p.y = lPts[i%lPts.length].y;
      p.tx = p.x; p.ty = p.y;
      p.color = CFG.color1.main; p.side = 'L';
      p.alpha = 0.92; p.targetAlpha = 0.92;
      p.vx = 0; p.vy = 0;
    }
    for (let i=half; i<particles.length; i++) {
      const p = particles[i]; const ri = i-half;
      p.x = rPts[ri%rPts.length].x; p.y = rPts[ri%rPts.length].y;
      p.tx = p.x; p.ty = p.y;
      p.color = CFG.color2.main; p.side = 'R';
      p.alpha = 0.92; p.targetAlpha = 0.92;
      p.vx = 0; p.vy = 0;
    }
    startBGM();
  }

  if (ph === PHASE.BEAT) {
    state.lx = W*0.28; state.rx = W*0.72;
    state.nameTextAlpha = 1.0;
  }

  if (ph === PHASE.COLLIDE) {
    state.hasExploded = false;
    state.shockwaveR = 0; state.shockwaveAlpha = 0;
    state.shockwave2R = 0; state.shockwave2Alpha = 0;
    state.flashAlpha = 0;
  }

  if (ph === PHASE.MERGE) {
    state.nameTextAlpha = 0;
    playHeartReveal();
    // Assign all particles to ONE PERFECTLY PROPORTIONED GOLDEN HEART (1.15x scale)
    const mPts = sampleHeartPoints(state.cx, state.cy, getHeartScale()*1.15, particles.length);
    for (let i=0; i<particles.length; i++) {
      const p = particles[i];
      // Position golden particles far OUTSIDE the screen perimeter
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.max(W, H) * (0.7 + Math.random() * 0.5);
      p.x = state.cx + Math.cos(angle) * dist;
      p.y = state.cy + Math.sin(angle) * dist;
      p.tx = mPts[i%mPts.length].x;
      p.ty = mPts[i%mPts.length].y;
      p.vx = 0;
      p.vy = 0;
      p.color = CFG.merged.main;
      p.side = 'C';
      p.alpha = 0.0;
      p.targetAlpha = 0.95;
    }
  }

  if (ph === PHASE.ECG) {
    state.ecgPoints = [];
    state.ecgProgress = 0;
    state.ecgFlat = true;
    state.ecgSpiked = false;
  }

  if (ph === PHASE.MSG_REVEAL) {
    state.msgAlpha = 0;
    state.finaleAlpha = 0;
  }

  if (ph === PHASE.FINALE) {
    state.finaleAlpha = 0;
  }
}

// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
//  MAIN DRAW LOOP
// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
let rafId = 0;

function lerp(a,b,t) { return a+(b-a)*t; }
function clamp(v,mn,mx) { return Math.max(mn,Math.min(mx,v)); }
function easeOut(t) { return 1 - Math.pow(1-t,3); }
function easeInOut(t) { return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

function draw(now) {
  rafId = requestAnimationFrame(draw);

  const dt = state.isPlaying ? clamp((now - state.lastFrame)/1000, 0, 0.05) : 0.016;
  state.lastFrame = now;

  if (state.isPlaying) {
    state.globalTime += dt;
    state.elapsed += dt;
  }

  const ph = state.phase;
  const elapsed = state.elapsed;

  // ΓöÇΓöÇ Background ΓöÇΓöÇ
  ctx.fillStyle = '#020002';
  ctx.fillRect(0, 0, W, H);

  // Radial dark glow at center
  if (ph >= PHASE.FLY_IN) {
    const gA = ph >= PHASE.MERGE ? 0.32 : 0.18;
    const gc = ctx.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, Math.min(W,H)*0.6);
    gc.addColorStop(0, ph>=PHASE.MERGE ? `rgba(255,180,0,${gA})` : `rgba(200,210,255,${gA})`);
    gc.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gc;
    ctx.fillRect(0,0,W,H);
  }

  // ΓöÇΓöÇ Stars ΓöÇΓöÇ
  const starAlpha = ph === PHASE.INTRO ? easeOut(elapsed/PHASE_DUR[PHASE.INTRO]) : ph >= PHASE.FLY_IN ? 1 : 0;
  for (const s of stars) {
    if (state.isPlaying) s.phase += dt * s.speed;
    const tw = 0.15 + 0.85*Math.abs(Math.sin(s.phase));
    ctx.save();
    ctx.globalAlpha = tw * 0.45 * starAlpha;
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff'; ctx.shadowBlur = s.r*3;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ΓöÇΓöÇ Hearts FLY IN from edges (Phase 2) ΓöÇΓöÇ
  if (ph === PHASE.FLY_IN) {
    const dur = PHASE_DUR[PHASE.FLY_IN];
    const flyProg = clamp(elapsed / (dur * 0.8), 0, 1);
    const easeProg = 1 - Math.pow(1 - flyProg, 4); // strong ease-out

    // Animate heart centers from off-screen to final position
    state.lx = lerp(-W*0.2, W*0.28, easeProg);
    state.rx = lerp( W*1.2, W*0.72, easeProg);
    state.nameTextAlpha = clamp((flyProg - 0.5) / 0.5, 0, 1);

    // Move all particles with their heart
    const half = Math.floor(particles.length/2);
    const lPts = sampleHeartPoints(state.lx, state.ly, getHeartScale(), half);
    const rPts = sampleHeartPoints(state.rx, state.ry, getHeartScale(), particles.length - half);
    for (let i=0; i<half; i++) {
      const p = particles[i];
      p.tx = lPts[i%lPts.length].x; p.ty = lPts[i%lPts.length].y;
      p.x += (p.tx - p.x) * 0.25;
      p.y += (p.ty - p.y) * 0.25;
      p.alpha = 0.92;
    }
    for (let i=half; i<particles.length; i++) {
      const p = particles[i]; const ri = i-half;
      p.tx = rPts[ri%rPts.length].x; p.ty = rPts[ri%rPts.length].y;
      p.x += (p.tx - p.x) * 0.25;
      p.y += (p.ty - p.y) * 0.25;
      p.alpha = 0.92;
    }
  }

  // ΓöÇΓöÇ Hearts Collide ΓÇö HIGH SPEED CRASH! (Phase 4) ΓöÇΓöÇ
  if (ph === PHASE.COLLIDE) {
    const colProg = clamp(elapsed / 0.9, 0, 1);
    // Cubic acceleration ΓÇö slow start, FAST crash
    const easeAccel = colProg * colProg * colProg;
    state.lx = lerp(W*0.28, W*0.50, easeAccel);
    state.rx = lerp(W*0.72, W*0.50, easeAccel);
    state.nameTextAlpha = Math.max(0, 1 - colProg * 2);

    if (!state.hasExploded) {
      const half = Math.floor(particles.length/2);
      const lPts = sampleHeartPoints(state.lx, state.ly, getHeartScale(), half);
      const rPts = sampleHeartPoints(state.rx, state.ry, getHeartScale(), particles.length - half);
      for (let i=0; i<half; i++) {
        particles[i].tx = lPts[i%lPts.length].x; particles[i].ty = lPts[i%lPts.length].y;
        particles[i].x += (particles[i].tx - particles[i].x) * 0.4;
        particles[i].y += (particles[i].ty - particles[i].y) * 0.4;
      }
      for (let i=half; i<particles.length; i++) {
        const ri = i-half;
        particles[i].tx = rPts[ri%rPts.length].x; particles[i].ty = rPts[ri%rPts.length].y;
        particles[i].x += (particles[i].tx - particles[i].x) * 0.4;
        particles[i].y += (particles[i].ty - particles[i].y) * 0.4;
      }
    }

    // MOMENT OF COLLISION IMPACT! ≡ƒÆÑ
    if (colProg >= 1.0 && !state.hasExploded) {
      state.hasExploded = true;
      playMergeExplosion();

      // MASSIVE explosion ΓÇö particles fly high speed off screen!
      for (const p of particles) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.max(W, H) * (0.9 + Math.random() * 1.2);
        p.vx = Math.cos(angle) * speed;
        p.vy = Math.sin(angle) * speed;
        p.alpha = 1.0;
      }
      state.shockwaveR = 5;
      state.shockwaveAlpha = 1.0;
      state.shockwave2R = 5;
      state.shockwave2Alpha = 0;
      state.flashAlpha = 1.0;
      setTimeout(() => { state.shockwave2Alpha = 0.8; }, 120);
    }
  }

  // ΓöÇΓöÇ Render & Update Flying Particle Trails ΓöÇΓöÇ
  for (let i = flyTrailParticles.length - 1; i >= 0; i--) {
    const tp = flyTrailParticles[i];
    if (state.isPlaying) {
      tp.x += tp.vx;
      tp.y += tp.vy;
      tp.vx *= 0.94;
      tp.vy *= 0.94;
      tp.life++;
      tp.alpha = Math.max(0, 0.95 * (1 - tp.life / tp.maxLife));
    }
    if (tp.life >= tp.maxLife || tp.alpha <= 0) {
      flyTrailParticles.splice(i, 1);
      continue;
    }
    drawHeart(ctx, tp.x, tp.y, tp.size, tp.color, tp.alpha, tp.glow, tp.size * 2.2);
  }

  // ΓöÇΓöÇ Heartbeat timing ΓöÇΓöÇ
  const beatInterval = state.beatInterval;
  if (state.isPlaying && (ph === PHASE.FLY_IN || ph === PHASE.BEAT)) {
    if (state.globalTime - state.lastLBeat >= beatInterval) {
      state.lastLBeat = state.globalTime;
      state.lBeat = state.globalTime;
      playHeartbeat('L', 0.85);
    }
    if (state.globalTime - state.lastRBeat >= beatInterval * 1.05) {
      state.lastRBeat = state.globalTime;
      state.rBeat = state.globalTime;
      playHeartbeat('R', 0.85);
    }
  }
  if (state.isPlaying && ph >= PHASE.MERGE) {
    if (state.globalTime - state.lastCBeat >= beatInterval * 0.92) {
      state.lastCBeat = state.globalTime;
      state.cBeat = state.globalTime;
      playHeartbeat('C', 1.25);
    }
  }

  // ΓöÇΓöÇ Pulse scale ΓöÇΓöÇ
  function getPulse(lastBeat, amp=0.12) {
    const t = state.globalTime - lastBeat;
    if (t < 0.15) return 1 + amp*Math.sin((t/0.15)*Math.PI);
    if (t > 0.19 && t < 0.34) return 1 + (amp*0.6)*Math.sin(((t-0.19)/0.15)*Math.PI);
    return 1;
  }

  // ΓöÇΓöÇ Update & Draw Particles ΓöÇΓöÇ
  const lPulse = (ph < PHASE.MERGE) ? getPulse(state.lBeat, 0.15) : 1;
  const rPulse = (ph < PHASE.MERGE) ? getPulse(state.rBeat, 0.15) : 1;
  const cPulse = (ph >= PHASE.MERGE) ? getPulse(state.cBeat, 0.12) : 1;

  for (const p of particles) {
    if (state.isPlaying) {
      if (state.hasExploded && ph < PHASE.MERGE) {
        // Exploding particles blast radially outward in 360 degrees off screen
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.99;
        p.vy *= 0.99;
        p.alpha = Math.max(0, p.alpha - dt * 0.12);
      } else if (ph !== PHASE.FLY_IN) {
        let tx = p.tx, ty = p.ty;
        if (p.side==='L' && ph<PHASE.MERGE) { tx=state.lx+(p.tx-state.lx)*lPulse; ty=state.ly+(p.ty-state.ly)*lPulse; }
        if (p.side==='R' && ph<PHASE.MERGE) { tx=state.rx+(p.tx-state.rx)*rPulse; ty=state.ry+(p.ty-state.ry)*rPulse; }
        if (p.side==='C')                   { tx=state.cx+(p.tx-state.cx)*cPulse; ty=state.cy+(p.ty-state.cy)*cPulse; }

        const lFactor = ph === PHASE.MERGE ? 0.07 : 0.2;
        p.x += (tx - p.x) * lFactor + p.vx;
        p.y += (ty - p.y) * lFactor + p.vy;
        p.vx *= 0.85; p.vy *= 0.85;
        p.alpha += (p.targetAlpha - p.alpha) * 0.1;
      }
    }

    if (ph < PHASE.FLY_IN || p.alpha < 0.02) continue;

    const glowC = p.side==='L' ? CFG.color1.glow : p.side==='R' ? CFG.color2.glow : CFG.merged.glow;
    drawHeart(ctx, p.x, p.y, p.size, p.color, p.alpha, glowC, p.size*2.5);
  }

  // ΓöÇΓöÇ SCREEN FLASH on Collision ΓöÇΓöÇ
  if (state.flashAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = state.flashAlpha;
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    if (state.isPlaying) state.flashAlpha *= 0.82;
  }

  // ΓöÇΓöÇ Shockwave Rings on Collision ΓöÇΓöÇ
  if (state.shockwaveAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = state.shockwaveAlpha;
    ctx.strokeStyle = '#ffffff';
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 50;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(W*0.50, H*0.42, state.shockwaveR, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
    if (state.isPlaying) {
      state.shockwaveR += dt * 600;
      state.shockwaveAlpha *= 0.88;
    }
  }
  // Second delayed shockwave (golden)
  if (state.shockwave2Alpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = state.shockwave2Alpha;
    ctx.strokeStyle = '#ffd700';
    ctx.shadowColor = 'rgba(255,215,0,0.9)';
    ctx.shadowBlur = 40;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(W*0.50, H*0.42, state.shockwave2R, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
    if (state.isPlaying) {
      state.shockwave2R += dt * 480;
      state.shockwave2Alpha *= 0.88;
    }
  }

  // ΓöÇΓöÇ Glow rings under hearts ΓöÇΓöÇ
  if (ph >= PHASE.FLY_IN && ph < PHASE.MERGE && state.nameTextAlpha > 0.1) {
    [[state.lx, state.ly, CFG.color1.glow, state.lBeat],
     [state.rx, state.ry, CFG.color2.glow, state.rBeat]].forEach(([hx,hy,gc,lb]) => {
      const pulse = getPulse(lb, 0.15);
      const r = getHeartScale()*10*pulse;
      const rg = ctx.createRadialGradient(hx,hy-r*0.2,r*0.1, hx,hy,r*1.8);
      rg.addColorStop(0,gc.replace('0.85','0.3')); rg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.save(); ctx.globalAlpha = state.nameTextAlpha; ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(hx,hy,r*1.8,0,Math.PI*2); ctx.fill(); ctx.restore();
    });
  }
  if (ph >= PHASE.MERGE) {
    const pulse = getPulse(state.cBeat, 0.12);
    const r = getHeartScale()*14*pulse;
    const rg = ctx.createRadialGradient(state.cx,state.cy-r*0.2,r*0.1,state.cx,state.cy,r*2.2);
    rg.addColorStop(0,'rgba(255,200,0,0.3)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.save(); ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(state.cx,state.cy,r*2.2,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  // ΓöÇΓöÇ Name Text ΓöÇΓöÇ
  if (ph >= PHASE.FLY_IN && ph < PHASE.MERGE && state.nameTextAlpha > 0.01) {
    const fontFamily = "'Cormorant Garamond', Georgia, serif";
    const fontSize = Math.max(20, Math.min(W*0.032, 36));

    ctx.save();
    ctx.shadowBlur = 20; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.globalAlpha = state.nameTextAlpha;

    // Name1 under left heart
    ctx.shadowColor = CFG.color1.glow;
    ctx.fillStyle = CFG.color1.main;
    ctx.font = `italic 600 ${fontSize}px ${fontFamily}`;
    ctx.fillText(CFG.name1, state.lx, state.ly + getHeartScale()*19.5);

    // Name2 under right heart
    ctx.shadowColor = CFG.color2.glow;
    ctx.fillStyle = CFG.color2.main;
    ctx.fillText(CFG.name2, state.rx, state.ry + getHeartScale()*19.5);
    ctx.restore();
  }

  // ΓöÇΓöÇ ECG Line ΓöÇΓöÇ
  if (ph === PHASE.ECG || ph >= PHASE.MSG_REVEAL) {
    const ecgY = H*0.82;
    const ecgW = W*0.8;
    const ecgX0 = W*0.1;
    const spikeH = H*0.06;
    const prog = clamp(elapsed/2.2, 0, 1);
    const col = ph >= PHASE.MSG_REVEAL ? CFG.merged.main : CFG.merged.main;

    if (state.isPlaying && ph === PHASE.ECG) {
      // Build ECG path
      const totalPts = 200;
      while (state.ecgPoints.length < Math.floor(prog*totalPts)) {
        const idx = state.ecgPoints.length;
        const t = idx/totalPts;
        let y = 0;
        // ECG waveform pattern: flat, then PQRST spike
        const spikePct = 0.55;
        if (t < spikePct - 0.12) { y=0; }
        else if (t < spikePct - 0.05) { y = Math.sin((t-(spikePct-0.12))/0.07*Math.PI)*0.18; }
        else if (t < spikePct) { y = -1.0*Math.pow(Math.sin(((t-(spikePct-0.05))/0.05)*Math.PI),2); }
        else if (t < spikePct+0.05) { y = 0.65*Math.sin(((t-spikePct)/0.05)*Math.PI); }
        else { y = 0; }
        state.ecgPoints.push({ t, y });
      }
    }

    if (state.ecgPoints.length > 1 || ph > PHASE.ECG) {
      ctx.save();
      ctx.strokeStyle = col;
      ctx.shadowColor = CFG.merged.glow;
      ctx.shadowBlur = 14;
      ctx.lineWidth = 2.2;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.beginPath();

      const pts = state.ecgPoints;
      if (pts.length > 0) {
        ctx.moveTo(ecgX0 + pts[0].t*ecgW, ecgY + pts[0].y*spikeH);
        for (let i=1; i<pts.length; i++)
          ctx.lineTo(ecgX0 + pts[i].t*ecgW, ecgY + pts[i].y*spikeH);
      }

      // If finale: draw completed flat then spike
      if (ph > PHASE.ECG) {
        ctx.moveTo(ecgX0, ecgY);
        const spikePct = 0.55;
        const points200 = [];
        for (let idx=0; idx<200; idx++) {
          const t=idx/200; let y=0;
          if (t < spikePct-0.12) y=0;
          else if (t<spikePct-0.05) y=Math.sin((t-(spikePct-0.12))/0.07*Math.PI)*0.18;
          else if (t<spikePct) y=-1.0*Math.pow(Math.sin(((t-(spikePct-0.05))/0.05)*Math.PI),2);
          else if (t<spikePct+0.05) y=0.65*Math.sin(((t-spikePct)/0.05)*Math.PI);
          else y=0;
          points200.push({t,y});
        }
        if (points200.length>0) {
          ctx.moveTo(ecgX0+points200[0].t*ecgW, ecgY+points200[0].y*spikeH);
          for (let i=1;i<points200.length;i++)
            ctx.lineTo(ecgX0+points200[i].t*ecgW, ecgY+points200[i].y*spikeH);
        }
        // Heartbeat dot that rides the pulse
        const beatT = ((state.globalTime*0.7)%1);
        let byVal=0;
        if(beatT<0.43)byVal=0; else if(beatT<0.50)byVal=Math.sin((beatT-0.43)/0.07*Math.PI)*0.18;
        else if(beatT<0.55)byVal=-Math.pow(Math.sin((beatT-0.50)/0.05*Math.PI),2);
        else if(beatT<0.60)byVal=0.65*Math.sin((beatT-0.55)/0.05*Math.PI);
        else byVal=0;
        const bx2=ecgX0+beatT*ecgW, by2=ecgY+byVal*spikeH;
        ctx.restore();
        ctx.save();
        ctx.globalAlpha=0.9; ctx.fillStyle=CFG.merged.main;
        ctx.shadowColor=CFG.merged.glow; ctx.shadowBlur=18;
        drawHeart(ctx,bx2,by2,5,CFG.merged.main,0.9,CFG.merged.glow,12);
      } else {
        ctx.stroke();
        ctx.restore();
      }
      if (ph > PHASE.ECG) {
        ctx.restore();
        // Re-stroke for finale
        ctx.save();
        ctx.strokeStyle=col; ctx.shadowColor=CFG.merged.glow; ctx.shadowBlur=14;
        ctx.lineWidth=2.2; ctx.lineJoin='round'; ctx.lineCap='round';
        const points200b=[];
        for(let idx=0;idx<200;idx++){
          const t=idx/200;let y=0;
          const sp=0.55;
          if(t<sp-0.12)y=0;else if(t<sp-0.05)y=Math.sin((t-(sp-0.12))/0.07*Math.PI)*0.18;
          else if(t<sp)y=-Math.pow(Math.sin(((t-(sp-0.05))/0.05)*Math.PI),2);
          else if(t<sp+0.05)y=0.65*Math.sin(((t-sp)/0.05)*Math.PI);else y=0;
          points200b.push({t,y});
        }
        ctx.beginPath();
        ctx.moveTo(ecgX0+points200b[0].t*ecgW,ecgY+points200b[0].y*spikeH);
        for(let i=1;i<points200b.length;i++)ctx.lineTo(ecgX0+points200b[i].t*ecgW,ecgY+points200b[i].y*spikeH);
        ctx.stroke(); ctx.restore();
      }
    }
  }

  // ΓöÇΓöÇ Message & Names Text Reveal ΓöÇΓöÇ
  if (ph >= PHASE.MSG_REVEAL) {
    if (state.isPlaying) state.msgAlpha = clamp(state.msgAlpha + dt * 0.45, 0, 1);
    const pulse = getPulse(state.cBeat, 0.04);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 1. Main Title ("Two Hearts, One Beat")
    const ffSerif = "'Cormorant Garamond', Georgia, serif";
    const mainSz = Math.max(22, Math.min(W * 0.038, 38)) * pulse;
    ctx.globalAlpha = state.msgAlpha;
    ctx.shadowColor = CFG.merged.glow;
    ctx.shadowBlur = 28;
    ctx.fillStyle = '#fff8e7';
    ctx.font = `italic 600 ${mainSz}px ${ffSerif}`;
    ctx.fillText(CFG.msg, W / 2, H * 0.07);

    // 2. Subtitle ("Forever Yours ≡ƒÆ¢")
    const subSz = Math.max(12, Math.min(W * 0.016, 18)) * pulse;
    ctx.globalAlpha = Math.max(0, (state.msgAlpha - 0.2) / 0.8);
    ctx.font = `italic 400 ${subSz}px ${ffSerif}`;
    ctx.fillStyle = '#ffd700';
    ctx.shadowBlur = 16;
    ctx.fillText(CFG.sub, W / 2, H * 0.125);

    // 3. Names ("Romeo Γ¥ñ Juliet") right after Forever Yours!
    const ffCursive = "'Great Vibes', cursive";
    const nameSz = Math.max(22, Math.min(W * 0.04, 40)) * pulse;
    ctx.globalAlpha = Math.max(0, (state.msgAlpha - 0.4) / 0.6);
    ctx.font = `${nameSz}px ${ffCursive}`;
    ctx.fillStyle = '#ffd700';
    ctx.shadowBlur = 22;
    ctx.fillText(`${CFG.name1}  Γ¥ñ  ${CFG.name2}`, W / 2, H * 0.185);

    ctx.restore();
  }

  // ΓöÇΓöÇ Falling Hearts Rain (starts as soon as MERGE phase ΓÇö faster, dense & smooth) ΓöÇΓöÇ
  if (ph >= PHASE.MERGE) {
    if (state.isPlaying && Math.random() < 0.65) {
      const colors = [CFG.color1.main, CFG.color2.main, CFG.merged.main, '#ff8fa3', '#ffffff', '#ffd700', '#ff4d6d'];
      fallingHearts.push({
        x: Math.random() * W,
        y: -30,
        vx: (Math.random() - 0.5) * 1.2,
        vy: 2.5 + Math.random() * 4.0, // Faster & graceful falling speed
        size: 4 + Math.random() * 8,   // Rich, varied heart sizes
        color: colors[Math.floor(Math.random() * colors.length)],
        alpha: 0.8 + Math.random() * 0.2,
        spin: Math.random() * Math.PI * 2,
      });
    }
    for (let i = fallingHearts.length - 1; i >= 0; i--) {
      const fh = fallingHearts[i];
      if (state.isPlaying) {
        fh.x += fh.vx + Math.sin(state.globalTime * 1.2 + i) * 0.6;
        fh.y += fh.vy;
        fh.spin += 0.03;
        // Fade out gracefully near bottom of screen
        if (fh.y > H * 0.82) fh.alpha = Math.max(0, fh.alpha - 0.02);
      }
      if (fh.y > H + 40 || fh.alpha <= 0) {
        fallingHearts.splice(i, 1);
        continue;
      }
      drawHeart(ctx, fh.x, fh.y, fh.size, fh.color, fh.alpha, fh.color, fh.size * 0.9);
    }
  }

  // ΓöÇΓöÇ Click burst hearts ΓöÇΓöÇ
  for (let i=state.clickHearts.length-1;i>=0;i--) {
    const h=state.clickHearts[i];
    if(state.isPlaying){h.x+=h.vx;h.y+=h.vy;h.vy+=0.1;h.vx*=0.97;h.life++;h.alpha=Math.max(0,1-(h.life/h.maxLife));h.size*=0.98;}
    if(h.life>=h.maxLife||h.size<0.3){state.clickHearts.splice(i,1);continue;}
    drawHeart(ctx,h.x,h.y,h.size,h.color,h.alpha,h.color,h.size*0.8);
  }

  // ΓöÇΓöÇ Phase advance ΓöÇΓöÇ
  if (state.isPlaying && state.phase !== PHASE.IDLE && state.phase !== PHASE.FINALE) {
    const dur = PHASE_DUR[state.phase];
    if (dur !== undefined && dur > 0 && elapsed >= dur) {
      enterPhase(state.phase + 1);
    }
  }
}

// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
//  CLICK & TOUCH INTERACTION
// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
function spawnClickHearts(x,y) {
  const colors=[CFG.color1.main,CFG.color2.main,CFG.merged.main,'#ff8fa3','#ffffff','#ffd700'];
  for(let i=0;i<14;i++){
    const angle=Math.PI*1.3+Math.random()*Math.PI*0.4;
    const speed=1.5+Math.random()*4;
    state.clickHearts.push({
      x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      size:4+Math.random()*5,alpha:1,
      color:colors[Math.floor(Math.random()*colors.length)],
      life:0,maxLife:55+Math.floor(Math.random()*35),
    });
  }
  playSparkle();
}

canvas.addEventListener('click', e=>{
  const r=canvas.getBoundingClientRect();
  spawnClickHearts(e.clientX-r.left, e.clientY-r.top);
});
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  if(e.touches[0]){spawnClickHearts(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);}
},{passive:false});

// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
//  RESET / RESTART
// ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ
function resetScene() {
  stopBGM();
  state.isPlaying = false;
  state.phase = PHASE.IDLE;
  state.elapsed = 0;
  state.globalTime = 0;
  state.lBeat=0;state.rBeat=0;state.cBeat=0;
  state.lastLBeat=0;state.lastRBeat=0;state.lastCBeat=0;
  state.hasExploded=false; state.shockwaveR=0; state.shockwaveAlpha=0;
  state.shockwave2R=0; state.shockwave2Alpha=0; state.flashAlpha=0;
  state.ecgPoints=[]; state.ecgProgress=0;
  state.nameTextAlpha=0; state.msgAlpha=0; state.finaleAlpha=0;
  state.clickHearts=[];
  fallingHearts=[];
  flyTrailParticles=[];
  state.lx=-W*0.2;state.ly=H*0.42;state.rx=W*1.2;state.ry=H*0.42;state.cx=W*0.50;state.cy=H*0.42;
  initParticles();
}

function startAnimation() {
  initAudio();
  state.isPlaying = true;
  state.lastFrame = performance.now();
  enterPhase(PHASE.INTRO);
}

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', ()=>{
  initAudio();
  overlay.classList.add('fade-out');
  setTimeout(()=>{ overlay.style.display='none'; }, 800);
  resetScene();
  startAnimation();
});

const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const panelClose = document.getElementById('panelClose');

settingsBtn.addEventListener('click',()=>{ initAudio(); settingsPanel.classList.toggle('open'); });
panelClose.addEventListener('click',()=>settingsPanel.classList.remove('open'));

function bindInput(id, key) {
  const el=document.getElementById(id);
  el.addEventListener('input',()=>{ CFG[key]=el.value; });
}
bindInput('inp-name1','name1');
bindInput('inp-name2','name2');
bindInput('inp-msg','msg');
bindInput('inp-sub','sub');

// Color pickers
function bindColorRow(rowId, target) {
  document.getElementById(rowId).addEventListener('click',e=>{
    const opt=e.target.closest('.color-opt'); if(!opt) return;
    document.querySelectorAll(`#${rowId} .color-opt`).forEach(o=>o.classList.remove('active'));
    opt.classList.add('active');
    const scheme=opt.dataset.scheme;
    if(scheme && COLOR_SCHEMES[scheme]) CFG[target]={...COLOR_SCHEMES[scheme]};
  });
}
bindColorRow('color1-row','color1');
bindColorRow('color2-row','color2');

// Speed
document.getElementById('speed-row').addEventListener('click',e=>{
  const opt=e.target.closest('.color-opt'); if(!opt||!opt.dataset.speed) return;
  document.querySelectorAll('#speed-row .color-opt').forEach(o=>o.classList.remove('active'));
  opt.classList.add('active');
  const sp={slow:0.6, normal:1.0, fast:1.65}[opt.dataset.speed]||1.0;
  CFG.speed=sp; state.beatInterval=0.85/sp;
});

// Sound
document.getElementById('sound-row').addEventListener('click',e=>{
  const opt=e.target.closest('.color-opt'); if(!opt||!opt.dataset.sound) return;
  document.querySelectorAll('#sound-row .color-opt').forEach(o=>o.classList.remove('active'));
  opt.classList.add('active');
  CFG.sound = opt.dataset.sound==='on';
  if(!CFG.sound) stopBGM();
  else if(state.phase>=PHASE.HEARTS_IN) startBGM();
});

document.getElementById('btn-restart').addEventListener('click',()=>{
  initAudio();
  resetScene();
  startAnimation();
});

const recBtn = document.getElementById('btn-rec');
recBtn.addEventListener('click',()=>{
  initAudio();
  if (!state.isRecording) {
    try {
      const stream = canvas.captureStream(30);
      const mr = new MediaRecorder(stream, { mimeType:'video/webm;codecs=vp9' });
      state.recChunks=[];
      mr.ondataavailable=e=>{ if(e.data.size>0) state.recChunks.push(e.data); };
      mr.onstop=()=>{
        const blob=new Blob(state.recChunks,{type:'video/webm'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download='heartbeat-sync.webm'; a.click();
        URL.revokeObjectURL(url);
      };
      mr.start(100);
      state.mediaRecorder=mr; state.isRecording=true;
      recBtn.classList.add('active'); recBtn.textContent='ΓÅ╣ Stop Rec';
    } catch(err) { console.error('Recording failed:', err); }
  } else {
    state.mediaRecorder?.stop();
    state.isRecording=false;
    recBtn.classList.remove('active'); recBtn.textContent='ΓÅ║ Record';
  }
});
